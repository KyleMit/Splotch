<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No user-scalable=no / maximum-scale here on purpose (ADR-0076, supersedes
         ADR-0041). The drawing page still can't be pinch-zoomed — but the lock is
         now scoped to that one route, not the whole document: only the drawing
         route carries `data-app-surface` (seeded on <html> by the boot script
         below, kept current by the / page), which app.css turns into
         `touch-action: none` across the page; the engine's touch preventDefault
         (drawing/engine.ts) is a second layer on the canvas itself. So a
         pinch/spread mid-stroke still draws instead of zooming the page. Every
         OTHER route (/privacy, /admin, anything added later) defaults to
         touch-action: auto and is freely pinch-zoomable for low-vision users —
         which, with the meta attributes gone, clears the sole Lighthouse a11y
         deduction (92 → 100). Inside the drawing page, parent-facing overlays get
         app-controlled zoom via the scoped `pinchZoom` / `pinchTextZoom` actions
         instead of browser zoom (there's no JS to reset browser zoom, so a stray
         page zoom would strand a toddler). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" />
    <!-- No title, description, or social card here: every route sets its own
         in <svelte:head>, and a template copy would precede the route's, so a
         browser tab and a scraper would both read the template's. The home
         route's come from lib/components/page/socialCard.ts. -->

    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Splotch" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

    <!-- Pre-hydration state stamp. The home page is prerendered (ADR-0040), so its
         static HTML can't know the visitor's viewport or stored preferences; this
         runs synchronously before first paint to seed the first-paint state that
         would otherwise flash from a default before hydration. The Action-center
         panel adopts the same state onto its own root during hydration and its
         CSS stops consulting this bootstrap seed after data-action-panel-live is
         present. These <html> values remain immutable so live button changes do
         not invalidate the drawing document.

         An attribute is stamped only when the value DEVIATES from the default, so
         the raw prerendered HTML (this script never having run) already renders the
         defaults correctly — the script is a pure optimization for returning users
         with customized settings, never load-bearing for a new/default visitor.
           • data-orientation — boot orientation (media queries stay primary for
             layout; also read by lib/state/layout.svelte.ts).
           • --action-btn-scale — button size; only set when ≠ 100% (the CSS
             var()'s fallback is the default, so an unset value is already correct).
           • data-drawer-open — present only when the drawer is open (default: closed).
           • data-off-<control> — present only when that Settings control is hidden
             (default: on/shown). The Tool Drawer switch hides its own tools without
             touching their flags, so those read as off while it is off.
           • data-single-brush — the one enabled optional brush, when exactly one
             remains, so its direct-button face is correct before hydration.
           • data-no-actions — present when no first-paint action is painted,
             so the panel and its drawer control never paint empty.
           • data-ai-slot — present for opted-in AI when the last known network
             state was online. The button paints disabled until its grant resolves.
           • --action-btn-count — set only when persisted hidden controls reduce
             or the AI button expands the default five-button row; the hydrated panel then
             publishes its live count on its own root.
           • data-brush — the persisted brush type when it deviates from the default
             pen ('crayon' or 'magic'; the eraser is never persisted), so the Brush
             Button wears the right face at first paint. Mirrors state/tool.svelte.ts.
           • data-theme — present only when the parent explicitly chose light or dark
             (default: system, where the prefers-color-scheme CSS drives the theme
             with no attribute at all). Mirrors lib/theme.ts.
           • data-reduce-motion — present when motion is reduced: the stored
             preference is 'reduce', or it is 'system' (the default) and the OS asks
             for reduced motion; 'full' overrides the OS. Every reduced-motion CSS
             treatment keys off this attribute, never off the media query, so it is
             restamped here whenever the OS preference changes — on the routes that
             import state/appearance.svelte.ts that module stamps the same answer.
             Mirrors lib/platform/reducedMotion.ts.
         The keys, defaults, and the scale clamp mirror settings.svelte.ts
         (ACTION_BUTTON_SCALE_*, BOOL_SETTINGS); app.html.test.ts fails on divergence.

         The theme-color meta above is the one value this script REPAINTS rather
         than stamps: the tag ships as THEME_COLORS.light, and every route needs
         it on the RESOLVED theme so the browser address bar and PWA status bar
         match the page under them. The drawing route and /design import
         state/appearance.svelte.ts; other routes rely on this script to follow
         the OS preference. The change listener stands down whenever the
         drawing surface is on screen (data-app-surface) because NotchBand tints
         the same tag with the active drawing color there. The colors mirror
         THEME_COLORS and the resolution mirrors resolveTheme(), both in
         lib/theme.ts; app.html.test.ts runs this script and fails on divergence. -->
    <script>
      (function () {
        var el = document.documentElement;

        // A full document load cannot hydrate SvelteKit from one of the
        // shallow history entries used for Back-managed dialogs and drawings.
        // Retire those entries before the router starts; an in-app navigation
        // never reruns this script, so its live stack remains restorable.
        // The state keys mirror webBackHandler.ts and SvelteKit's history
        // contract; app.html.test.ts guards the bundle-boundary duplication.
        var pageState = history.state && history.state['sveltekit:states'];
        var backState = pageState && pageState.splotchBackNavigation;
        if (
          backState &&
          typeof backState.guard === 'boolean' &&
          Number.isInteger(backState.dialogs) &&
          backState.dialogs >= 0
        ) {
          var backDepth = Number(backState.guard) + backState.dialogs;
          if (backDepth > 0) history.go(-backDepth);
        }

        try {
          var on = function (key, def) {
            var raw = localStorage.getItem(key);
            if (raw === 'true') return true;
            if (raw === 'false') return false;
            return def;
          };

          el.setAttribute(
            'data-orientation',
            window.matchMedia('(orientation: portrait)').matches ? 'portrait' : 'landscape'
          );

          // Mark the drawing route as the immersive app surface (see app.css /
          // ADR-0076): no scroll, no text selection, no zoom, no iOS callout.
          // Seeded here so those locks apply from first paint, with no window
          // where the page scrolls or the chrome is zoomable before hydration;
          // the / page's effect keeps it correct across client-side navigation.
          // Every other route stays a normal document by default.
          el.toggleAttribute('data-app-surface', location.pathname === '/');

          var scaleRaw = localStorage.getItem('splotch-action-button-scale');
          var pct = scaleRaw == null ? 100 : parseInt(scaleRaw, 10);
          if (isNaN(pct)) pct = 100;
          pct = Math.max(70, Math.min(130, pct));
          if (pct !== 100) el.style.setProperty('--action-btn-scale', String(pct / 100));

          el.toggleAttribute('data-drawer-open', on('splotch-drawer-open', false));
          var drawer = on('splotch-tool-drawer-enabled', true);
          var stroke = drawer && on('splotch-stroke-width-control', true);
          var crayon = drawer && on('splotch-crayon-enabled', true);
          var magic = drawer && on('splotch-magic-brush-enabled', true);
          var eraser = drawer && on('splotch-eraser-enabled', true);
          var coloring = on('splotch-coloring-book-enabled', true);
          var screenshot = on('splotch-screenshot-enabled', true);
          var undo = drawer && on('splotch-undo-button-enabled', true);
          el.toggleAttribute('data-off-stroke', !stroke);
          el.toggleAttribute('data-off-crayon', !crayon);
          el.toggleAttribute('data-off-magic', !magic);
          el.toggleAttribute('data-off-eraser', !eraser);
          el.toggleAttribute('data-off-coloring', !coloring);
          el.toggleAttribute('data-off-screenshot', !screenshot);
          el.toggleAttribute('data-off-undo', !undo);

          var optionalBrushCount = crayon + magic + eraser;
          if (optionalBrushCount === 1) {
            el.setAttribute('data-single-brush', crayon ? 'crayon' : magic ? 'magic' : 'eraser');
          }

          var visibleActionButtonCount =
            (optionalBrushCount > 0 ? 1 : 0) + stroke + coloring + screenshot + undo;
          var aiSlot =
            on('splotch-ai-image-enabled', false) && on('splotch-last-network-online', true);
          el.toggleAttribute('data-ai-slot', aiSlot);
          var actionButtonCount = visibleActionButtonCount + Number(aiSlot);
          el.toggleAttribute('data-no-actions', actionButtonCount === 0);
          if (actionButtonCount !== 5 && actionButtonCount > 0) {
            el.style.setProperty('--action-btn-count', String(actionButtonCount));
          }

          var brush = localStorage.getItem('splotch-brush-type');
          if ((brush === 'crayon' && crayon) || (brush === 'magic' && magic)) {
            el.setAttribute('data-brush', brush);
          }
        } catch (e) {
          /* private-mode / disabled storage — fall back to CSS defaults */
        }

        try {
          if (localStorage.getItem('splotch-toolbar-style') === 'bare')
            el.setAttribute('data-toolbar', 'bare');
        } catch (_) {}
        var theme;
        try {
          theme = localStorage.getItem('splotch-theme');
        } catch (e) {
          /* unavailable storage leaves the OS preference in control */
        }
        var explicitTheme = theme === 'light' || theme === 'dark';
        if (explicitTheme) el.setAttribute('data-theme', theme);

        var motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        var stampReduceMotion = function () {
          var motion;
          try {
            motion = localStorage.getItem('splotch-reduce-motion');
          } catch (e) {
            /* unavailable storage leaves the OS preference in control */
          }
          var reduced = motion === 'reduce' || (motion !== 'full' && motionQuery.matches);
          el.toggleAttribute('data-reduce-motion', reduced);
        };
        stampReduceMotion();
        motionQuery.addEventListener('change', stampReduceMotion);

        var darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
        var themeColorMeta = document.querySelector('meta[name="theme-color"]');
        var paintThemeColor = function (dark) {
          themeColorMeta.setAttribute('content', dark ? '#17171d' : '#ffffff');
        };
        paintThemeColor(explicitTheme ? theme === 'dark' : darkQuery.matches);
        if (!explicitTheme) {
          darkQuery.addEventListener('change', function (e) {
            if (!el.hasAttribute('data-app-surface')) paintThemeColor(e.matches);
          });
        }
      })();
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
