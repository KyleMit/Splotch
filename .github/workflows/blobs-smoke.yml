# Verifies that Netlify Blobs is actually live on a deployed function — the
# failure mode from ADR-0025, where a V1 function never gets the Blobs context,
# getStore() throws, and token storage silently degrades to the in-memory
# fallback. tools/api-smoke/check-deployed-blobs.mjs round-trips a token through the live deploy
# and asserts the snapshot's `persistent` flag is true.
#
# GitHub's deployment_status event is repository-wide, and this repository's
# deployment records belong to the static scrapbook on GitHub Pages rather than
# Netlify. The daily run probes production; workflow_dispatch can target any
# intended Netlify preview or production URL.
#
# Requires a repo secret ADMIN_ACCESS_TOKEN matching the deploy's admin secret;
# it only travels in the login POST body over https. Normal runs remove their
# probe token; process-level interruption may require the README's manual cleanup.
name: Blobs Smoke

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: Deploy URL to smoke (preview or production)
        required: true

permissions:
  contents: read

# Every deploy shares one site-wide Blobs store, so serialize all workflow runs. An in-flight run
# is not cancelled and can clean up; GitHub may replace an older pending run when another queues.
concurrency:
  group: blobs-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Netlify Blobs persistence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm
        with:
          cache: 'false'
          install: 'false'

      # No install: the smoke script and its tools/lib imports use only node
      # builtins, so installing the full dependency tree here would be waste.
      - name: Round-trip a token through Blobs on the live deploy
        env:
          BLOBS_SMOKE_URL: ${{ github.event.inputs.url || 'https://splotch.art' }}
          ADMIN_ACCESS_TOKEN: ${{ secrets.ADMIN_ACCESS_TOKEN }}
        run: node tools/api-smoke/check-deployed-blobs.mjs
