# Guards the mechanical identity and index invariants for docs/adrs/: each number
# identifies one record permanently, each H1 agrees with its filename, and each
# record has one canonical index entry while every local ADR link agrees with its
# target. Two records sharing a number makes every "ADR-NNNN" reference ambiguous,
# including references already written into merged records and commit messages
# that cannot be rewritten.
#
# Deliberately NOT path-filtered, so it reports on every pull request and is safe
# to mark required. A workflow skipped by a path filter leaves its check Pending
# forever and blocks any pull request that does not match, which is why GitHub
# advises against path filtering a required workflow. The check itself is
# unconditional, so the job always runs and always reports.
#
# No setup-node step: tools/adrs/check-adr-numbering.mjs imports only node: builtins
# and its own siblings, and the runner ships Node, so installing dependencies
# would cost ~15s to change nothing (setup-node measured at 14-20s in the Quality
# job, against well under a second for the check itself). node is invoked directly
# rather than through npm run for the same reason. The constraint that buys: this
# script and its lib may use only APIs present in the runner image's default Node,
# which is not the >=22.13 that package.json asks of contributors — anything
# newer means adding setup-node back and paying for it.
name: ADR Integrity

on:
  pull_request:
  merge_group:
  workflow_dispatch: # allow ad-hoc runs (e.g. auditing the numbering on main)

permissions:
  contents: read

concurrency:
  group: adr-numbering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  numbering:
    name: ADR numbers, headings, and index entries agree
    runs-on: ubuntu-latest
    # Bounds execution only. Time spent queued for a runner is not counted, so
    # this never fires on a queue stall no matter how long that stall runs —
    # only a wedge inside the job trips it. Sized to the work (a directory read
    # plus two shallow git operations) rather than to a comfortable margin, so a
    # wedge fails loudly instead of idling out a generous budget.
    timeout-minutes: 2
    env:
      BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
    steps:
      # Sparse rather than for speed — the job runs alongside a ~3.5min Tests job,
      # so the few seconds saved reach nobody. It states what this check depends
      # on, so a new dependency fails loudly here instead of working by accident:
      # docs/adrs for the records themselves, tools/adrs for the checker, and
      # tools/lib for the shared proc.mjs it imports.
      #
      # Paths only, no blob filter. The check needs real content on both sides —
      # it reads every record's first line, and -M rename detection compares
      # similarity across base and head — so filtering blobs would trade written
      # bytes for lazy per-object fetches.
      #
      # This step and the fetch below are the only ones that block on anything
      # outside the runner, which makes them the only plausible source of a hang.
      # Each carries its own bound so a wedged connection fails on the step that
      # wedged rather than consuming the whole job budget and reporting as a
      # timeout of the check itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          sparse-checkout: |
            docs/adrs
            tools/adrs
            tools/lib

      # The base branch as it stands now, not as this run's merge commit
      # remembers it: GitHub stops recomputing the merge ref once a pull request
      # conflicts, and a workflow that checked out the head ref would see no
      # base at all.
      - name: Fetch the base branch
        timeout-minutes: 1
        run: |
          git fetch --depth=1 origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      # Unconditional. Deciding whether to run costs more than running: the check
      # is a directory read, while detecting whether docs/adrs/ changed needs a
      # git diff. Skipping on "no ADR records changed" would also report success
      # against a tree that already holds duplicates, which is the exact state a
      # workflow_dispatch audit exists to find.
      - name: Check ADR integrity
        run: node tools/adrs/check-adr-numbering.mjs "--base=origin/${BASE_REF}"
