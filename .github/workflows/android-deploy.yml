# Runtime smoke test for the Android *deployment*: compile the Release
# configuration, test-sign its APK with an ephemeral key, install + launch it,
# and assert via Maestro that the UI actually renders (the Capacitor WebView
# booted and loaded the production web bundle). The web E2E suite (test.yml)
# can't catch R8/resource-shrinking or native/WebView boot failures — this can.
#
# Tag-only by design: an emulator job is the heaviest thing in CI, so it runs
# only when a release tag is pushed (the moment a crash would reach users), plus
# on demand from the Actions tab. It is deliberately NOT on every push/PR.
name: Android Deploy Smoke

on:
  push:
    tags: ['v*']
  workflow_dispatch: # allow ad-hoc runs from the GitHub Actions tab

permissions:
  contents: read

jobs:
  build:
    name: Build test-signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      levels: ${{ steps.levels.outputs.levels }}
    steps:
      # Capacitor 8 needs a JDK 21 toolchain (the bundled JBR 17 / java 17 fails
      # AGP's JdkImageTransform). See the android-build-toolchain notes.
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - name: Read emulator API levels
        id: levels
        run: |
          levels="$(node --experimental-strip-types --disable-warning=ExperimentalWarning tools/mobile/android/print-emulator-api-levels.mjs)"
          echo "levels=$levels" >> "$GITHUB_OUTPUT"

      # The known credentials protect no real identity: the key is generated on
      # this runner only so Android can install the optimized Release APK. The
      # Play upload key and its passwords remain local and never enter CI.
      - name: Create ephemeral release signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/splotch-release-smoke.p12" \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias release-smoke \
            -dname "CN=Splotch Release Smoke" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          {
            echo "storeFile=$RUNNER_TEMP/splotch-release-smoke.p12"
            echo 'storePassword=android'
            echo 'keyAlias=release-smoke'
            echo 'keyPassword=android'
          } > android/keystore.properties

      - name: Build test-signed release APK
        run: npm run android:apk:release

      - name: Upload test-signed release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: Maestro launch smoke test (API ${{ matrix.api-level }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(needs.build.outputs.levels) }}
    # Ubuntu + KVM is the most reliable path for Android emulators in CI.
    # macOS ARM runners (macos-latest → macos-15-arm64) hit an HVF init failure
    # with emulator 36.x ("HVF error: HV_UNSUPPORTED"), so the emulator never
    # boots. Ubuntu KVM + x86_64 is cheaper, faster, and battle-tested.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      # Maestro needs Java 17+; use the same JDK 21 line as the Android build.
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm
        with:
          install: false

      - name: Download test-signed release APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release

      - uses: ./.github/actions/install-maestro

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # -no-snapshot-save: throwaway VM — never persist state between runs
          # -no-window: headless (no display on the CI runner)
          # -noaudio / -no-boot-anim: skip audio init and boot animation for faster boot
          # -camera-back none: no camera emulation (unused by the app; avoids extra init)
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            # :device runs Maestro against the emulator this action already booted.
            # (Plain `test:android` boots + tears down its own emulator — for local use.)
            npm run test:android:device

      - name: Upload Maestro report
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-maestro-report
        with:
          name: maestro-report-api-${{ matrix.api-level }}

  # A tag-only gate nobody is watching is not a gate: this one was red on every
  # release tag from v1.3.0 through v1.5.0, and all three shipped anyway. One
  # downstream reporter covers the build/resolver and the whole smoke matrix,
  # waits for every leg, and files at most once. Manual runs are excluded because
  # whoever dispatched one is already reading the result.
  report-failure:
    name: File Android deploy failure
    needs: [build, smoke]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' &&
        (needs.build.result != 'success' || needs.smoke.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: File the failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          PLATFORM: Android
        run: |
          title="${PLATFORM} native deploy gate failed"
          if [[ "$BUILD_RESULT" != "success" ]]; then
            cause="The shared build/resolver job failed (result: ${BUILD_RESULT}), so the emulator matrix
          could not reliably start. Read that job to distinguish checkout, toolchain, resolver, signing,
          build, and APK-upload failures."
          else
            cause="At least one launch-smoke matrix leg failed or could not start (aggregate result:
          ${SMOKE_RESULT}). The flow asserts only first paint (ADR-0120); inspect the named API jobs to
          distinguish emulator/toolchain failures from a shipped artifact that did not boot and paint."
          fi
          body="$(cat <<EOF
          The ${PLATFORM} native deploy gate failed for ${GITHUB_REF_NAME}.

          * Run: ${RUN_URL}
          * Results: build/resolver=${BUILD_RESULT}; smoke matrix=${SMOKE_RESULT}.
          * Evidence: every completed smoke leg attempts to upload a
            \`maestro-report-api-<API>\` artifact with its flow log and failure screenshot.

          ${cause}
          EOF
          )"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label type:bug --label area:native --body "$body"
          fi
