# Runtime smoke test for the Android *deployment*: build the app the way it
# ships, boot a real emulator, install + launch it, and assert via Maestro that
# the UI actually renders (the Capacitor WebView booted and loaded the production
# web bundle). The web E2E suite (test.yml) can't catch native/WebView boot
# failures — this can.
#
# Tag-only by design: an emulator job is the heaviest thing in CI, so it runs
# only when a release tag is pushed (the moment a crash would reach users), plus
# on demand from the Actions tab. It is deliberately NOT on every push/PR.
name: Android Deploy Smoke

on:
  push:
    tags: ['v*']
  workflow_dispatch: # allow ad-hoc runs from the GitHub Actions tab

permissions:
  contents: read

jobs:
  smoke:
    name: Maestro launch smoke test
    # Ubuntu + KVM is the most reliable path for Android emulators in CI.
    # macOS ARM runners (macos-latest → macos-15-arm64) hit an HVF init failure
    # with emulator 36.x ("HVF error: HV_UNSUPPORTED"), so the emulator never
    # boots. Ubuntu KVM + x86_64 is cheaper, faster, and battle-tested.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    steps:
      # Capacitor 8 needs a JDK 21 toolchain (the bundled JBR 17 / java 17 fails
      # AGP's JdkImageTransform). See the android-build-toolchain notes.
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      # Build the *debug* APK: it's auto-signed with the debug key (installable
      # with no production secrets) and `cap:sync` still bakes the production web
      # bundle, so the WebView boot path under test is the real one. (`adb install`
      # takes an APK — never the .aab, which the original sample got wrong.)
      - name: Build debug APK
        run: npm run android:apk

      - uses: ./.github/actions/install-maestro

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Keep in sync with ANDROID_API_LEVEL in tools/mobile/android/lib/android-toolchain.mjs
          # (enforced by tools/mobile/android/tests/android-config.test.mjs).
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # -no-snapshot-save: throwaway VM — never persist state between runs
          # -no-window: headless (no display on the CI runner)
          # -noaudio / -no-boot-anim: skip audio init and boot animation for faster boot
          # -camera-back none: no camera emulation (unused by the app; avoids extra init)
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r -t android/app/build/outputs/apk/debug/app-debug.apk
            # :device runs Maestro against the emulator this action already booted.
            # (Plain `test:android` boots + tears down its own emulator — for local use.)
            npm run test:android:device

      - name: Upload Maestro report
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-maestro-report
        with:
          name: maestro-report

      # A tag-only gate nobody is watching is not a gate: this one was red on
      # every release tag from v1.3.0 through v1.5.0, and all three shipped
      # anyway because a tag push is the one CI event no one is looking at. One
      # open issue collects every red tag until it is closed. Manual runs are
      # excluded — whoever dispatched one is already reading the result.
      - name: File the failure
        if: ${{ failure() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Android native launch smoke failed'
          body="$(cat <<EOF
          The Android launch smoke failed for ${GITHUB_REF_NAME}.

          * Run: ${RUN_URL}
          * Evidence: the maestro-report artifact on that run holds the flow log and the
            screenshot taken at the failing step.

          The flow asserts only that the installed app launches and paints its UI (ADR-0120),
          so a failure here is a real boot regression in the shipped artifact — the build,
          the Capacitor config, the static export, or the WebView start — not flow drift.
          EOF
          )"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label type:bug --label area:native --body "$body"
          fi
