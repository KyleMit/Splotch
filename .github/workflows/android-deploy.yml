# Runtime smoke test for the Android *deployment*: compile the Release
# configuration, test-sign its APK with an ephemeral key, install + launch it,
# and assert via Maestro that the UI actually renders (the Capacitor WebView
# booted and loaded the production web bundle). The web E2E suite (test.yml)
# can't catch R8/resource-shrinking or native/WebView boot failures — this can.
#
# Tag-only by design: an emulator job is the heaviest thing in CI, so it runs
# only when a release tag is pushed (the moment a crash would reach users), plus
# on demand from the Actions tab. It is deliberately NOT on every push/PR.
name: Android Deploy Smoke

on:
  push:
    tags: ['v*']
  workflow_dispatch: # allow ad-hoc runs from the GitHub Actions tab

permissions:
  contents: read

jobs:
  emulator-api-levels:
    name: Resolve emulator API levels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      levels: ${{ steps.levels.outputs.levels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm
        with:
          install: false

      - name: Read emulator API levels
        id: levels
        run: |
          echo "levels=$(node --experimental-strip-types --disable-warning=ExperimentalWarning tools/mobile/android/print-emulator-api-levels.mjs)" >> "$GITHUB_OUTPUT"

  smoke:
    name: Maestro launch smoke test (API ${{ matrix.api-level }})
    needs: emulator-api-levels
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(needs.emulator-api-levels.outputs.levels) }}
    # Ubuntu + KVM is the most reliable path for Android emulators in CI.
    # macOS ARM runners (macos-latest → macos-15-arm64) hit an HVF init failure
    # with emulator 36.x ("HVF error: HV_UNSUPPORTED"), so the emulator never
    # boots. Ubuntu KVM + x86_64 is cheaper, faster, and battle-tested.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    steps:
      # Capacitor 8 needs a JDK 21 toolchain (the bundled JBR 17 / java 17 fails
      # AGP's JdkImageTransform). See the android-build-toolchain notes.
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      # The known credentials protect no real identity: the key is generated on
      # this runner only so Android can install the optimized Release APK. The
      # Play upload key and its passwords remain local and never enter CI.
      - name: Create ephemeral release signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/splotch-release-smoke.p12" \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias release-smoke \
            -dname "CN=Splotch Release Smoke" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          {
            echo "storeFile=$RUNNER_TEMP/splotch-release-smoke.p12"
            echo 'storePassword=android'
            echo 'keyAlias=release-smoke'
            echo 'keyPassword=android'
          } > android/keystore.properties

      - name: Build test-signed release APK
        run: npm run android:apk:release

      - uses: ./.github/actions/install-maestro

      - name: Run smoke test on emulator
        id: smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # -no-snapshot-save: throwaway VM — never persist state between runs
          # -no-window: headless (no display on the CI runner)
          # -noaudio / -no-boot-anim: skip audio init and boot animation for faster boot
          # -camera-back none: no camera emulation (unused by the app; avoids extra init)
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            # :device runs Maestro against the emulator this action already booted.
            # (Plain `test:android` boots + tears down its own emulator — for local use.)
            npm run test:android:device

      - name: Upload Maestro report
        id: report
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-maestro-report
        with:
          name: maestro-report-api-${{ matrix.api-level }}

      # A tag-only gate nobody is watching is not a gate: this one was red on
      # every release tag from v1.3.0 through v1.5.0, and all three shipped
      # anyway because a tag push is the one CI event no one is looking at. One
      # open issue collects every red tag until it is closed. Manual runs are
      # excluded — whoever dispatched one is already reading the result.
      #
      # `failure()` deliberately covers the whole job, not just the smoke step:
      # a tag that fails at checkout, the APK build, or the toolchain is just as
      # unwatched, and narrowing this to the smoke would reopen the hole for
      # every other way the gate can go red. The body is what stays honest about
      # which happened — it claims a boot regression only when the smoke itself
      # failed, and offers the artifact only when the upload produced one.
      - name: File the failure
        if: ${{ failure() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          PLATFORM: Android
          ARTIFACT: maestro-report-api-${{ matrix.api-level }}
        run: |
          title="${PLATFORM} native deploy gate failed"
          if [[ "$SMOKE_OUTCOME" == "failure" ]]; then
            cause="The launch smoke itself failed, so the shipped artifact did not boot and paint. The
          flow asserts only that (ADR-0120), which makes this a real regression in the build, the
          Capacitor config, the static export, or the WebView start — not flow drift."
          else
            cause="The smoke step did not fail (outcome: ${SMOKE_OUTCOME:-never reached}); the job went red
          somewhere else — checkout, toolchain, the build, or the report upload. Read the run before
          treating this as a product regression."
          fi
          if [[ "$REPORT_OUTCOME" == "success" ]]; then
            evidence="* Evidence: the ${ARTIFACT} artifact on that run holds the flow log and any
            screenshot taken at the failing step."
          else
            evidence="* No ${ARTIFACT} artifact was produced (upload outcome: ${REPORT_OUTCOME:-never reached})."
          fi
          body="$(cat <<EOF
          The ${PLATFORM} native deploy gate failed for ${GITHUB_REF_NAME}.

          * Run: ${RUN_URL}
          ${evidence}

          ${cause}
          EOF
          )"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label type:bug --label area:native --body "$body"
          fi
