name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  # Pull requests collapse per ref, so a new push cancels the run it supersedes.
  # Pushes get a per-commit group instead, so merges that land back to back
  # each keep their own run on main rather than cancelling the earlier one.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # A compile smoke of the exact configuration Netlify ships: the artifact is
  # discarded. Every other job builds with the dev-harness/profiling seams
  # compiled in, so only this job proves the release bundle — where those
  # branches dead-code-eliminate (ADR-0010, ADR-0083) — still builds.
  release-build-smoke:
    name: Release build smoke
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - name: Build without profiling seams
        run: env -u PERF_MARKS -u PUBLIC_ENABLE_DEV_HARNESS npm run build

      # The native build's postbuild scan rejects web-only routes, boot services,
      # and downloadable coloring books from the embedded app bundle.
      - name: Build native bundle boundary
        run: env -u PERF_MARKS -u PUBLIC_ENABLE_DEV_HARNESS npm run build:cap

  quality:
    name: Quality
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      # Fast-fail the cheapest, most-common failure first: a formatting-only
      # red PR should not wait through svelte-check + eslint to surface.
      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run check

      # The React Native candidate in experiments/native-architecture is its own TypeScript
      # project, which `npm run check` does not reach.
      - name: Native candidate type check
        run: npm run check:migration:types

      - name: Lint
        run: npm run lint

      # CSS lint (stylelint, stylelint.config.js): every <style> block and
      # hand-authored .css file in the repo, minus the generated and promoted
      # output named in its ignoreFiles. The rule set is grown one measured
      # rule at a time; ADR-0031 records the adopted set and the rejected
      # candidates with their violation counts.
      - name: CSS lint
        run: npm run lint:css

      # Drift guard: fails if any shipped SVG under web/ isn't SVGO-optimized
      # (a new icon landed un-optimized). Fix with `npm run optimize:svg-assets`.
      - name: SVG optimization check
        run: npm run check:svg-assets

      # Drift guard: every CLAUDE.md/AGENTS.md and the .claude/skills/ +
      # .agents/skills/ trees are generated from .ruler/ (ADR-0058). Fails if a
      # .ruler edit wasn't applied or a generated file was edited directly.
      # Fix with `npm run ruler:apply` and commit.
      - name: Agent-file drift
        run: npm run ruler:check

      # Drift guard: ideas-review.html is generated from the frozen exploration
      # corpus. Fix with the documented build-review.mjs command and commit.
      - name: Ideas review drift
        run: npm run check:ideas-review

      # Drift guard: web/src/tokens.css is generated from the design-token
      # source of truth in web/src/lib/design/tokens.ts (ADR-0071). Fails if a
      # tokens.ts edit wasn't applied or the generated CSS was edited directly.
      # Fix with `npm run gen:tokens` and commit.
      - name: Design-token drift
        run: npm run gen:tokens:check

      # Token-style ratchet: component <style> blocks must use the design tokens
      # (ADR-0071); the per-file allowlist of documented one-offs lives in
      # tools/tokens/lint-token-styles.mjs. Fails on any new raw hex color or raw
      # 2+-digit z-index.
      - name: Token style lint
        run: npm run lint:tokens

      # Dead-code gate (knip): fails on unused files, exports, and exported
      # types. Remove the dead symbol, or tag a deliberate seam /** @public */.
      - name: Dead-code check
        run: npm run lint:dead

      # ADR-0070 dependency split: Netlify installs with --prod, so a package the
      # deploy imports but package.json files under devDependencies breaks only
      # the deploy, after merge. knip.production.json's entries are what the
      # deploy executes.
      - name: Production dependency check
        run: npm run lint:deps:prod

      # Asset byte-stability guard: fails if any committed art asset (coloring
      # pages, style covers, fill-src raws) changed without regenerating
      # tools/asset-gen/golden/asset-manifest.sha256 — turns silent binary churn
      # into a reviewable text diff. Guards the invariant that a night-only fill
      # pass leaves light-mode bytes untouched. Fix with `npm run gen:assets:manifest`.
      - name: Asset manifest check
        run: npm run check:assets:manifest

      # Drift guard: every scrapbook/ collection dir must resolve to at least one
      # linked entry page, so the index's "N collections" count always matches the
      # cards it renders (md-only collections included, ADR-0059). Fix by adding an
      # entry page/report or removing the empty dir.
      - name: Scrapbook index check
        run: npm run scrapbook:check

      # High and critical advisories block the build; lower severities remain
      # visible in the audit output without making the quality gate permanently red.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  # No browser and no app build: everything here is browserless Node, so
  # putting it in the e2e job would drag it through Playwright setup while
  # every shard waits. Runner minutes are free on this public repo; wall clock
  # isn't. `npm run test:browserless` runs these steps locally;
  # tools/ci-mirror/tests/run-browserless-tests.test.mjs fails if the two drift.
  browserless:
    name: Browserless tests
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # The native app's tool tiers put a green run at 5-8 minutes; 10 cut runs off mid-suite.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Run asset-pipeline tests
        run: npm run test:asset-gen

      - name: Run store-drawing pipeline tests
        run: npm run test:store-drawings

      - name: Run repo-script tests
        run: npm run test:tools

      # The RN candidate's drawing-screen tests mount through the released native react-strict-dom
      # renderer, an alias test:tools cannot carry, so they run as their own tier. Its pre hook
      # generates web/.svelte-kit, which the web/src modules those tests import need.
      - name: Run RSD native-renderer tests
        run: npm run test:migration:rsd-selection

      # The /api/* contract (CORS/preflight, admin auth, oracle shapes, the
      # canonical error envelope) has no other per-PR coverage. The hosted
      # deploy smoke (hosted-deploy-smoke.yml) checks the deployed contract
      # against production daily, after merge. Self-contained: serves the
      # function on its own throwaway plain Node host (no SvelteKit, no vite
      # dev) on the smoke's default port, needs no browser and no model/Blobs
      # credentials.
      - name: API contract smoke
        run: npm run test:api:smoke

  # The deploy (netlify.toml) builds the React Native web export from a production-only install
  # (PNPM_FLAGS = --prod, ADR-0070), so this job does too: a build package filed under
  # devDependencies fails here rather than on Netlify. The deploy leaves out the checks that drive
  # Chromium, since --prod installs no Playwright; this job adds the dev packages and runs the
  # whole post-build hook over the same export.
  native-web-build:
    name: Native web build
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm
        with:
          install: 'false'

      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod

      - name: Build the site from the production install
        run: npm run build:site

      - name: Install development dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Check the export in Chromium
        run: npm run postnative:web:build

  # Lighthouse's scheduler-derived TBT and score are too noisy to gate on a
  # shared runner. Three samples make the median resilient to one outlier; the
  # stable FCP/LCP medians keep deliberately wide regression thresholds. This
  # is a production BUILD comparison, not a claim about the local preview's
  # HTTP/1.1 numbers matching Netlify's CDN.
  page-load-performance:
    name: Page-load performance
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Run page-load performance gate
        run: npm run test:lighthouse:ci -- --port=4197

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-page-load
          path: lighthouse-reports/ci/
          if-no-files-found: warn
          retention-days: 7

  # Each shard builds the app itself rather than restoring it from a build job:
  # a shared artifact serializes every shard behind `needs:` (measured ≈81s +
  # tests) while concurrent per-shard builds overlap (≈69s + tests). Playwright's
  # `--shard` deals out individual tests (fullyParallel), self-balancing by
  # count as tests are added — no hand-kept partition. The matrix is wide enough
  # to disperse adjacent stress tests while setup still overlaps every shard.
  test:
    name: Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # strategy.job-total is the shard denominator, so shard must remain the
      # only matrix axis with no include/exclude entries. workflow-hygiene.test.mjs enforces it.
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      # Chromium alone: the non-Blink browsers are deliberately absent, so
      # playwright.config.ts drops both engine-smoke projects. Their standalone
      # jobs below own that coverage.
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Run e2e tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # The gen:* generators drive the live app through tools/app-driver/lib/app-driver.mjs
      # and never run elsewhere in CI, so this smoke keeps that module from rotting
      # silently on selector/import changes. Reuses the chromium installed above.
      # One shard suffices — the smoke doesn't shard, it just needs to run once.
      - name: App-driver smoke
        if: ${{ matrix.shard == 1 }}
        run: npm run test:driver:smoke

      # The worker sweep only ever runs from the manual worker-sweep.yml, so a
      # config change that breaks its harness stays invisible until the next
      # re-tune — issue #1044 was exactly that, every rep green-lighting zero
      # tests. One grepped rep proves a sweep still executes tests; --prebuilt
      # reuses the bundle the e2e step above just built.
      - name: Worker-sweep smoke
        if: ${{ matrix.shard == 1 }}
        run: npm run test:sweep:smoke

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          # playwrightReportFolder in web/playwright.shared.ts: the HTML report
          # plus the flaky reporter's flaky.json. Drift-guarded by
          # tools/tests/playwright-report-folder.test.mjs.
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7

  # Firefox uses the same small engine-smoke subset as WebKit but needs none of
  # WebKit's GStreamer/ffmpeg stack. A separate parallel job closes the only
  # remaining engine-family gap without adding another browser to every shard.
  firefox-smoke:
    name: Firefox smoke
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - uses: ./.github/actions/setup-playwright
        with:
          browsers: firefox

      - name: Run Firefox smoke
        run: npm run test:firefox:smoke
        env:
          # Assert that the installed binary produced a Firefox project instead
          # of letting Playwright silently drop the smoke from this job.
          REQUIRE_FIREFOX: 1

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-firefox
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7

  # WebKit's apt dependencies are the expensive half of the Ubuntu browser
  # install: WebKit adds the whole GStreamer/ffmpeg media stack (~110 packages /
  # 60 MB) that Chromium doesn't need, and installing it lands on every run —
  # setup-playwright's apt package cache takes the network out of that install,
  # not the install itself. Paying it in a job parallel to Tests, rather than
  # inside it, keeps ~40s off the critical path for what is four tests. The
  # alternative — hand-listing the subset of WebKit's libraries this app
  # actually links against — was measured as the slower option and pins ~23 apt
  # package names that churn across Ubuntu releases, which
  # `playwright install-deps` tracks upstream for free.
  webkit-smoke:
    name: WebKit smoke
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - uses: ./.github/actions/setup-playwright
        with:
          browsers: webkit

      - name: Run WebKit smoke
        run: npm run test:webkit:smoke
        env:
          # Assert (not just assume) the WebKit project is in the run —
          # playwright.config.ts throws if the binary is missing, so a bad cache
          # or edited install line fails loudly instead of silently dropping
          # WebKit coverage.
          REQUIRE_WEBKIT: 1

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-webkit
          # Same pinned folder as the shard reports above.
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7
