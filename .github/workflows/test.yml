# The tiled renderer has no cold blob-encoding path, so ADR-0100's structural
# half retired with that legacy history implementation. The millisecond P95
# still needs WebKit and a stable host, so it runs post-merge on macOS over
# multi-finger (the sole multi-pointer exerciser) plus crayon-scribbles (the sole
# mid-stroke pass-split exerciser), and release tags run all seven scenarios.
name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  # Pull requests collapse per ref, so a new push cancels the run it supersedes.
  # Pushes get a per-commit group instead: the WebKit commit gate runs
  # post-merge (ADR-0100), and a same-ref cancel would drop a commit's only
  # coverage precisely when merges land back to back — a silent hole exactly
  # when the safety net matters most.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # A compile smoke of the exact configuration Netlify ships: the artifact is
  # discarded. Every other job builds with the dev-harness/profiling seams
  # compiled in, so only this job proves the release bundle — where those
  # branches dead-code-eliminate (ADR-0010, ADR-0083) — still builds.
  release-build-smoke:
    name: Release build smoke
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - name: Build without profiling seams
        run: env -u PERF_MARKS -u PUBLIC_ENABLE_DEV_HARNESS npm run build

      # The native build's postbuild scan rejects web-only routes, boot services,
      # and downloadable coloring books from the embedded app bundle.
      - name: Build native bundle boundary
        run: env -u PERF_MARKS -u PUBLIC_ENABLE_DEV_HARNESS npm run build:cap

  quality:
    name: Quality
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      # Fast-fail the cheapest, most-common failure first: a formatting-only
      # red PR should not wait through svelte-check + eslint to surface.
      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      # Drift guard: fails if any shipped SVG under web/ isn't SVGO-optimized
      # (a new icon landed un-optimized). Fix with `npm run optimize:svg-assets`.
      - name: SVG optimization check
        run: npm run check:svg-assets

      # Drift guard: every CLAUDE.md/AGENTS.md and the .claude/skills/ +
      # .agents/skills/ trees are generated from .ruler/ (ADR-0058). Fails if a
      # .ruler edit wasn't applied or a generated file was edited directly.
      # Fix with `npm run ruler:apply` and commit.
      - name: Agent-file drift
        run: npm run ruler:check

      # Drift guard: ideas-review.html is generated from the frozen exploration
      # corpus. Fix with the documented build-review.mjs command and commit.
      - name: Ideas review drift
        run: npm run check:ideas-review

      # Drift guard: web/src/tokens.css is generated from the design-token
      # source of truth in web/src/lib/design/tokens.ts (ADR-0071). Fails if a
      # tokens.ts edit wasn't applied or the generated CSS was edited directly.
      # Fix with `npm run gen:tokens` and commit.
      - name: Design-token drift
        run: npm run gen:tokens:check

      # Token-style ratchet: component <style> blocks must use the design tokens
      # (ADR-0071); the per-file allowlist of documented one-offs lives in
      # tools/tokens/lint-token-styles.mjs. Fails on any new raw hex color or raw
      # 2+-digit z-index.
      - name: Token style lint
        run: npm run lint:tokens

      # Dead-code gate (knip): fails on unused files, exports, and exported
      # types. Remove the dead symbol, or tag a deliberate seam /** @public */.
      - name: Dead-code check
        run: npm run lint:dead

      # Asset byte-stability guard: fails if any committed art asset (coloring
      # pages, style covers, fill-src raws) changed without regenerating
      # tools/asset-gen/golden/asset-manifest.sha256 — turns silent binary churn
      # into a reviewable text diff. Guards the invariant that a night-only fill
      # pass leaves light-mode bytes untouched. Fix with `npm run gen:assets:manifest`.
      - name: Asset manifest check
        run: npm run check:assets:manifest

      # Drift guard: every scrapbook/ collection dir must resolve to at least one
      # linked entry page, so the index's "N collections" count always matches the
      # cards it renders (md-only collections included, ADR-0059). Fix by adding an
      # entry page/report or removing the empty dir.
      - name: Scrapbook index check
        run: npm run scrapbook:check

      # Build-time/transitive advisories are mostly unfixable; CI only
      # hard-fails on critical severities so the gate stays meaningful, not noisy.
      - name: Audit dependencies
        run: pnpm audit --audit-level=critical

  # No browser and no app build: everything here is browserless Node, so
  # putting it in the e2e job would drag it through Playwright setup while
  # every shard waits. Runner minutes are free on this public repo; wall clock
  # isn't.
  unit:
    name: Unit tests
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - name: Run unit tests
        run: npm run test:unit

      - name: Run asset-pipeline tests
        run: npm run test:asset-gen

      - name: Run store-drawing pipeline tests
        run: npm run test:store-drawings

      - name: Run repo-script tests
        run: npm run test:tools

      # The /api/* contract (CORS/preflight, admin auth, oracle shapes, the
      # canonical error envelope) has no other CI coverage — blobs-smoke.yml
      # checks only Blobs persistence, post-deploy. Self-contained: boots its
      # own throwaway vite dev server on the smoke's default port, needs no
      # browser and no model/Blobs credentials.
      - name: API contract smoke
        run: npm run test:api:smoke

  # Each shard builds the app itself rather than restoring it from a build job:
  # a shared artifact serializes every shard behind `needs:` (measured ≈81s +
  # tests) while concurrent per-shard builds overlap (≈69s + tests). Playwright's
  # `--shard` deals out individual tests (fullyParallel), self-balancing by
  # count as tests are added — no hand-kept partition. The matrix is wide enough
  # to disperse adjacent stress tests while setup still overlaps every shard.
  test:
    name: Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      # Chromium alone: WebKit is deliberately absent, so playwright.config.ts
      # drops the webkit project and this runs Chromium only. The webkit-smoke
      # job below owns that coverage.
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Run e2e tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # The gen:* generators drive the live app through tools/app-driver/lib/app-driver.mjs
      # and never run elsewhere in CI, so this smoke keeps that module from rotting
      # silently on selector/import changes. Reuses the chromium installed above.
      # One shard suffices — the smoke doesn't shard, it just needs to run once.
      - name: App-driver smoke
        if: ${{ matrix.shard == 1 }}
        run: npm run test:driver:smoke

      # The worker sweep only ever runs from the manual worker-sweep.yml, so a
      # config change that breaks its harness stays invisible until the next
      # re-tune — issue #1044 was exactly that, every rep green-lighting zero
      # tests. One grepped rep proves a sweep still executes tests; --prebuilt
      # reuses the bundle the e2e step above just built.
      - name: Worker-sweep smoke
        if: ${{ matrix.shard == 1 }}
        run: npm run test:sweep:smoke

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          # The HTML reporter resolves its default folder against the
          # package.json directory — the repo root here (ADR-0024), not web/.
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7

  # WebKit's apt dependencies are the expensive half of the Ubuntu browser
  # install: WebKit adds the whole GStreamer/ffmpeg media stack (~110 packages /
  # 60 MB) that Chromium doesn't need, and installing it lands on every run —
  # setup-playwright's apt package cache takes the network out of that install,
  # not the install itself. Paying it in a job parallel to Tests, rather than
  # inside it, keeps ~40s off the critical path for what is four tests. The
  # alternative — hand-listing the subset of WebKit's libraries this app
  # actually links against — was measured as the slower option and pins ~23 apt
  # package names that churn across Ubuntu releases, which
  # `playwright install-deps` tracks upstream for free.
  webkit-smoke:
    name: WebKit smoke
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - uses: ./.github/actions/setup-playwright
        with:
          browsers: webkit

      - name: Run WebKit smoke
        run: npm run test:webkit:smoke
        env:
          # Assert (not just assume) the WebKit project is in the run —
          # playwright.config.ts throws if the binary is missing, so a bad cache
          # or edited install line fails loudly instead of silently dropping
          # WebKit coverage.
          REQUIRE_WEBKIT: 1

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-webkit
          # Same package.json-relative resolution as the shard reports above.
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7

  # Post-merge, not per-PR (ADR-0100). This tier's verdict is a millisecond P95
  # on a shared macOS runner: it is the wall-clock floor of a run, and its
  # observed record on the pull-request path is false positives rather than
  # catches. Landing it on main trades an immediate signal for a fast one, so
  # the failure path files an issue rather than relying on someone noticing.
  webkit-commit-gate-fast:
    name: WebKit commit gate (fast)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 15
    # Serialized across commits, deliberately against the per-SHA workflow group
    # above. The filing step below is a check-then-create, so two failing runs
    # reaching it together would both find no open issue and both create one.
    # Running one gate at a time makes that check atomic by construction.
    # `queue: max` is load-bearing: the default `queue: single` cancels the
    # pending run when a third commit lands, which would reopen the very
    # coverage hole the per-SHA workflow group exists to close.
    concurrency:
      group: webkit-commit-gate-fast
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-playwright-webkit

      - name: Run fast WebKit commit gate
        run: npm run perf:web:undo:webkit:fast

      - name: Upload WebKit undo diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-undo-fast-diagnostics
          path: |
            perf-profiles/**/undo-scenarios.json
            perf-profiles/**/undo-scenarios.md
          if-no-files-found: warn
          retention-days: 7

      # A post-merge gate nobody is watching is not a gate. One open issue
      # collects every red commit until it is closed, so a broken main does not
      # file one issue per merge.
      - name: File the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='WebKit commit gate failed on main'
          body="$(cat <<EOF
          The post-merge WebKit commit gate failed on main at commit ${GITHUB_SHA}.

          * Run: ${RUN_URL}
          * Evidence: the webkit-undo-fast-diagnostics artifact on that run holds the scenario
            table (undo-scenarios.md) and every raw commit sample (undo-scenarios.json).

          This tier gates a millisecond P95 on a shared macOS runner, so before treating it as
          product evidence read the raw commit P95 against the normalized gate value in the
          report — ADR-0093 records why those differ and PR 729 records what happens when the
          difference is ignored. The legacy renderer's structural blob-encoding half retired with
          that implementation, so a failure here is a timing regression or host noise.
          EOF
          )"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label type:bug --label area:ci-testing --body "$body"
          fi

  webkit-commit-gate-full:
    name: WebKit commit gate (full)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-playwright-webkit

      - name: Restore fast-set history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .perf-state
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=webkit-undo-full-history&per_page=20" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id and (.workflow_run.head_branch | startswith("v")))][0].id // empty')"
          restore_ok=0
          if [[ -n "$artifact_id" ]]; then
            archive_path="${RUNNER_TEMP}/webkit-undo-full-history.zip"
            if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$archive_path" \
              && unzip -q "$archive_path" -d .perf-state; then
              restore_ok=1
            else
              echo "::warning::fast-set history restore failed; starting from the committed seed"
            fi
          fi
          if [[ "$restore_ok" -eq 0 ]]; then
            cp tools/perf/fixtures/undo-fast-set-history.seed.json .perf-state/undo-fast-set-history.json
          fi

      - name: Run full WebKit commit gate
        run: npm run perf:web:undo:webkit -- --fast-set-history=.perf-state/undo-fast-set-history.json

      - name: Persist WebKit full-run history
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-undo-full-history
          path: .perf-state/undo-fast-set-history.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Upload WebKit full-run diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-undo-full-diagnostics
          path: |
            perf-profiles/**/undo-scenarios.json
            perf-profiles/**/undo-scenarios.md
            perf-profiles/**/undo-fast-set-history.json
          if-no-files-found: warn
          retention-days: 90
