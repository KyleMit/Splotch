# WebKit timing is split by cost: pull requests run multi-finger (the sole
# encode-path exerciser) plus crayon-scribbles (mid-stroke pass splits) in a
# job parallel to Tests, while release tags run all seven scenarios. The fast
# subset stays below the existing Tests job's duration on the measured macOS
# runner; Ubuntu's WebKit runtime exceeds that budget. The tag-only full run
# buys broader path coverage without adding its cost to every change.
name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    name: Release build
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: Build without profiling seams
        run: env -u PERF_MARKS -u PUBLIC_ENABLE_DEV_HARNESS npm run build

  quality:
    name: Quality
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      # Fast-fail the cheapest, most-common failure first: a formatting-only
      # red PR should not wait through svelte-check + eslint to surface.
      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      # Drift guard: fails if any shipped SVG under web/ isn't SVGO-optimized
      # (a new icon landed un-optimized). Fix with `npm run img:audit`.
      - name: SVG audit
        run: npm run img:audit:check

      # Drift guard: every CLAUDE.md/AGENTS.md and the .claude/skills/ +
      # .agents/skills/ trees are generated from .ruler/ (ADR-0058). Fails if a
      # .ruler edit wasn't applied or a generated file was edited directly.
      # Fix with `npm run ruler:apply` and commit.
      - name: Agent-file drift
        run: npm run ruler:check

      # Drift guard: web/src/tokens.css is generated from the design-token
      # source of truth in web/src/lib/design/tokens.ts (ADR-0071). Fails if a
      # tokens.ts edit wasn't applied or the generated CSS was edited directly.
      # Fix with `npm run gen:tokens` and commit.
      - name: Design-token drift
        run: npm run gen:tokens:check

      # Token-style ratchet: component <style> blocks must use the design tokens
      # (ADR-0071); the per-file allowlist of documented one-offs lives in
      # scripts/lint-token-styles.mjs. Fails on any new raw hex color or raw
      # 2+-digit z-index.
      - name: Token style lint
        run: npm run lint:tokens

      # Dead-code gate (knip): fails on unused files, exports, and exported
      # types. Remove the dead symbol, or tag a deliberate seam /** @public */.
      - name: Dead-code check
        run: npm run lint:dead

      # Asset byte-stability guard: fails if any committed art asset (coloring
      # pages, style covers, fill-src raws) changed without regenerating
      # tools/asset-gen/golden/asset-manifest.sha256 — turns silent binary churn
      # into a reviewable text diff. Guards the invariant that a night-only fill
      # pass leaves light-mode bytes untouched. Fix with `npm run gen:assets:manifest`.
      - name: Asset manifest check
        run: npm run check:assets:manifest

      # Drift guard: every scrapbook/ collection dir must resolve to at least one
      # linked entry page, so the index's "N collections" count always matches the
      # cards it renders (md-only collections included, ADR-0059). Fix by adding an
      # entry page/report or removing the empty dir.
      - name: Scrapbook index check
        run: npm run scrapbook:check

      # Build-time/transitive advisories are mostly unfixable; CI only
      # hard-fails on critical severities so the gate stays meaningful, not noisy.
      - name: Audit dependencies
        run: npm audit --audit-level=critical

  test:
    name: Tests
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PW_BROWSERS: chromium webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - name: Run unit tests
        run: npm run test:unit

      - name: Run asset-pipeline tests
        run: npm run test:asset-gen

      - name: Run repo-script tests
        run: npm run test:scripts

      - name: Resolve Playwright version
        id: playwright-version
        run: node scripts/playwright-version.mjs >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # PW_BROWSERS marks the cache generation's browser coverage — a
          # cache without WebKit would silently skip the WebKit smoke project
          # (playwright.config.ts drops it when the binary is absent).
          key: playwright-${{ runner.os }}-${{ env.PW_BROWSERS }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ env.PW_BROWSERS }}

      # The browser binaries cache, but the apt packages don't — install-deps
      # is still required on a cache hit.
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ env.PW_BROWSERS }}

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          # Assert (not just assume) the WebKit smoke project is in the run —
          # playwright.config.ts throws if the binary is missing, so a bad
          # cache or edited install line fails loudly instead of silently
          # dropping WebKit coverage.
          REQUIRE_WEBKIT: 1

      # The gen:* generators drive the live app through scripts/lib/app-driver.mjs
      # and never run elsewhere in CI, so this smoke keeps that module from rotting
      # silently on selector/import changes. Reuses the chromium installed above.
      - name: App-driver smoke
        run: npm run test:driver:smoke

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  webkit-commit-gate-fast:
    name: WebKit commit gate (fast)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-playwright-webkit

      - name: Run fast WebKit commit gate
        run: npm run perf:undo:webkit:fast

      - name: Upload WebKit undo diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-undo-fast-diagnostics
          path: |
            perf-profiles/**/undo-scenarios.json
            perf-profiles/**/undo-scenarios.md
          if-no-files-found: warn
          retention-days: 7

  webkit-commit-gate-full:
    name: WebKit commit gate (full)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-playwright-webkit

      - name: Run full WebKit commit gate
        run: npm run perf:undo:webkit

      - name: Upload WebKit undo diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-undo-full-diagnostics
          path: |
            perf-profiles/**/undo-scenarios.json
            perf-profiles/**/undo-scenarios.md
          if-no-files-found: warn
          retention-days: 7
