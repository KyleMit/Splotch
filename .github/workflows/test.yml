# The tiled renderer has no cold blob-encoding path, so ADR-0100's structural
# half retired with that legacy history implementation. The millisecond P95
# still needs WebKit and a stable host, so it runs post-merge on macOS over
# multi-finger (the sole multi-pointer exerciser) plus crayon-scribbles (the sole
# mid-stroke pass-split exerciser), and release tags run all seven scenarios.
name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Fires the WebKit commit gates on demand — they otherwise run only
  # post-merge (fast) and on release tags (full), so exercising the gate
  # itself (a threshold change, a #1250-class investigation) previously
  # required a merge or a tag. A dispatch also runs the standard suite, since
  # every other job's condition already admits non-push events.
  workflow_dispatch:
    inputs:
      gate:
        description: Which WebKit commit gate(s) to run
        type: choice
        options: [fast, full, both]
        default: both

permissions:
  actions: read
  contents: read

concurrency:
  # Pull requests collapse per ref, so a new push cancels the run it supersedes.
  # Pushes get a per-commit group instead: the WebKit commit gate runs
  # post-merge (ADR-0100), and a same-ref cancel would drop a commit's only
  # coverage precisely when merges land back to back — a silent hole exactly
  # when the safety net matters most.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  webkit-native-sample:
    name: WebKit gate with native process sampling (issue 1700 diagnostic)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-playwright-webkit
      - name: Start native sampler
        run: |
          mkdir -p "$RUNNER_TEMP/samples"
          cat > "$RUNNER_TEMP/sampler.sh" <<'SH'
          #!/bin/bash
          out=$1; i=0
          while true; do
            for pid in $(pgrep -f "ms-playwright/webkit"); do
              name=$(basename "$(ps -o comm= -p $pid)" 2>/dev/null)
              case "$name" in *WebContent*|*GPU*) ;; *) continue;; esac
              (sudo sample $pid 3 -mayDie -file "$out/$(date +%s)-$i-$name-$pid.txt" >/dev/null 2>&1 &)
            done
            i=$((i+1)); sleep 3.2
          done
          SH
          chmod +x "$RUNNER_TEMP/sampler.sh"
          nohup "$RUNNER_TEMP/sampler.sh" "$RUNNER_TEMP/samples" > /dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/sampler.pid"
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize || true
          system_profiler SPDisplaysDataType || true
      - name: Run fast WebKit commit gate (advisory, timestamped)
        continue-on-error: true
        run: npm run perf:web:undo:webkit:fast 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date +%s.%N | cut -c1-14)" "$line"; done | tee "$RUNNER_TEMP/samples/gate.log"
      - name: Stop sampler
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/sampler.pid")" || true
          sleep 5
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/samples"
          ls "$RUNNER_TEMP/samples" | wc -l
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: webkit-native-samples
          path: |
            ${{ runner.temp }}/samples
            perf-profiles/**/undo-scenarios.json
            perf-profiles/**/undo-scenarios.md
          retention-days: 7
