# Runtime smoke test for the iOS *deployment* — the simulator/Xcode counterpart
# of android-deploy.yml. Boots an iPhone simulator, builds + installs the debug
# app, and asserts via Maestro that the UI renders (the Capacitor WebView booted
# and loaded the production web bundle). Neither the web E2E suite (test.yml) nor
# the Android smoke can catch an iOS-only WebView boot failure — this can.
#
# Tag-only by design: macOS runners are the most expensive thing in CI, so this
# runs only when a release tag is pushed (the moment an iOS crash would reach App
# Store users), plus on demand from the Actions tab. The debug build targets the
# simulator, so no signing secrets or provisioning profiles are involved.
name: iOS Deploy Smoke

on:
  push:
    tags: ['v*']
  workflow_dispatch: # allow ad-hoc runs from the GitHub Actions tab

permissions:
  contents: read

jobs:
  smoke:
    name: Maestro launch smoke test (iOS simulator)
    # macOS runners ship full Xcode and pre-installed iPhone simulators.
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/install-maestro

      # test:ios (tools/mobile/ios/run-simulator-smoke-test.mjs) auto-discovers and boots an
      # iPhone simulator, runs cap:sync (baking the production web bundle), builds
      # the Debug app for the simulator, installs it, runs .maestro/smoke.yaml —
      # the same flow the Android smoke runs — then shuts the simulator down.
      - name: Run iOS simulator smoke test
        run: npm run test:ios

      - name: Upload Maestro report
        if: ${{ !cancelled() }}
        uses: ./.github/actions/upload-maestro-report
        with:
          name: maestro-ios-report

      # Same reasoning as android-deploy.yml's filing step: a tag-only gate has
      # no audience at the moment it runs, so it has to raise its own hand. The
      # title is platform-specific because a red iOS gate and a green Android
      # one are different facts about the release.
      - name: File the failure
        if: ${{ failure() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='iOS native launch smoke failed'
          body="$(cat <<EOF
          The iOS launch smoke failed for ${GITHUB_REF_NAME}.

          * Run: ${RUN_URL}
          * Evidence: the maestro-ios-report artifact on that run holds the flow log and the
            screenshot taken at the failing step.

          The flow asserts only that the installed app launches and paints its UI (ADR-0120),
          so a failure here is a real boot regression in the shipped artifact — the build,
          the Capacitor config, the static export, or the WebView start — not flow drift.
          EOF
          )"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label type:bug --label area:native --body "$body"
          fi
