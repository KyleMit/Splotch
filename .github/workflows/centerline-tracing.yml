name: Centerline tracing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/centerline-tracing/**'
      - 'tools/store-drawings/gen-pointer-instructions.mjs'
      - '.github/workflows/centerline-tracing.yml'
  push:
    branches: [main]
    paths:
      - 'tools/centerline-tracing/**'
      - 'tools/store-drawings/gen-pointer-instructions.mjs'
      - '.github/workflows/centerline-tracing.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Locked tracer contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: tools/centerline-tracing/uv.lock

      - name: Sync locked Python environment
        run: uv sync --project tools/centerline-tracing --locked

      - name: Run quick tracer suite
        run: npm run test:centerline-tracing

      - name: Run representative integration trace
        run: >-
          uv run --project tools/centerline-tracing --locked pytest
          tools/centerline-tracing/tests/test_integration.py -m integration
