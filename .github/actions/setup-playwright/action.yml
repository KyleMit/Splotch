name: Set up Playwright
description: Cache and install Playwright browsers plus their apt system libraries, on the Ubuntu runners

# macOS has its own setup-playwright-webkit: no apt step, and a different
# browser cache path. Keeping them separate avoids per-OS branching in both.

inputs:
  browsers:
    description: Space-separated Playwright browsers to install (e.g. "chromium", "webkit")
    required: true

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      run: node tools/print-playwright-version.mjs >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        # The browser set is part of the key, so jobs installing different
        # browsers can't restore each other's half-populated cache — a cache
        # missing WebKit would silently drop the WebKit project
        # (playwright.config.ts omits it when the binary is absent).
        key: playwright-${{ runner.os }}-${{ inputs.browsers }}-${{ steps.playwright-version.outputs.version }}

    # Both steps below are bounded by coreutils `timeout` because a composite action's
    # steps cannot take `timeout-minutes` — only job steps can. A degraded runner starves
    # these of bandwidth, and unbounded that reads as a hung test: the job's own
    # timeout-minutes cancels every remaining step, so nothing downstream can report which
    # one was slow. Bounded, the step fails by name and exits 124. This does not rescue a
    # bad run — the recovery unit is the runner, and nothing inside a job can change
    # runners — it only makes the diagnosis cheap.
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      # Legitimately downloads a browser on this branch, so the bound is generous.
      env:
        BROWSER_INSTALL_TIMEOUT_S: '600'
      run: timeout "$BROWSER_INSTALL_TIMEOUT_S" npx playwright install --with-deps ${{ inputs.browsers }}

    # The browser binaries cache, but the apt packages don't — install-deps
    # is still required on a cache hit.
    - name: Install Playwright system deps
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      # Pure network against the apt mirrors, ~25s on a healthy runner; the observed
      # degraded run took 12m27s of a 15-minute job budget.
      env:
        SYSTEM_DEPS_TIMEOUT_S: '120'
      run: timeout "$SYSTEM_DEPS_TIMEOUT_S" npx playwright install-deps ${{ inputs.browsers }}
