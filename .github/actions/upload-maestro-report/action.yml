name: Upload Maestro report
description: Upload the Maestro test report

inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Report paths, including platform driver diagnostics when available
    default: ~/.maestro/tests/

runs:
  using: composite
  steps:
    - if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        # Multiple report roots make .maestro a hidden ancestor of the flow evidence.
        include-hidden-files: true
        retention-days: 7
        if-no-files-found: ignore
