name: Set up Node
description: Set up the repository's Node version and optional npm dependencies

inputs:
  cache:
    description: Enable the npm cache
    required: false
    default: 'true'
  install:
    description: Install npm dependencies
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        # The engines floor major from package.json engines.node — CI must exercise
        # the oldest supported line, the one the Netlify deploy and floor-version dev
        # machines run, not a newer major that would hide floor-only breakage.
        # scripts/tests/workflow-hygiene.test.mjs guards this agreement.
        node-version: 22
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        package-manager-cache: ${{ inputs.cache }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: npm ci
