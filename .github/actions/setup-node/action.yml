name: Set up Node
description: Set up the repository's Node and pnpm versions and optional dependencies

inputs:
  cache:
    description: Enable the pnpm store cache
    required: false
    default: 'true'
  install:
    description: Install dependencies
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Before setup-node, not after: `cache: pnpm` below resolves the store
    # directory by running pnpm, so pnpm has to already be on PATH. The version
    # comes from package.json's packageManager field, which is also what corepack
    # reads locally — CI and a dev machine cannot drift onto different pnpm majors.
    - if: inputs.cache == 'true' || inputs.install == 'true'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        # The engines floor major from package.json engines.node — CI must exercise
        # the oldest supported line, the one the Netlify deploy and floor-version dev
        # machines run, not a newer major that would hide floor-only breakage.
        # tools/tests/workflow-hygiene.test.mjs guards this agreement.
        node-version: 22
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        package-manager-cache: ${{ inputs.cache }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
