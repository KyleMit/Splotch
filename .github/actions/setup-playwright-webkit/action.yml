name: Set up Playwright WebKit
description: Install dependencies and cache the Playwright WebKit browser on macOS

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-pnpm

    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      run: node tools/print-playwright-version.mjs >> "$GITHUB_OUTPUT"

    - name: Resolve runner image OS
      id: runner-image
      shell: bash
      # ImageOS names the OS release (macos15) and changes only when GitHub moves the
      # runner label to a new release, unlike ImageVersion, which changes with every image
      # rebuild. A step has to read it: the env context holds only workflow-set variables.
      run: echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        # The OS release and architecture are part of the key because Playwright
        # downloads a separate WebKit build for each, yet builds sharing a
        # revision unpack into the same webkit-<revision> directory, which then
        # counts as installed.
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.os }}-webkit-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install webkit
