name: Set up Playwright WebKit
description: Install dependencies and cache the Playwright WebKit browser on macOS

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node

    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      run: node tools/print-playwright-version.mjs >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-webkit-${{ steps.playwright-version.outputs.version }}

    # Deliberately unbounded, unlike the Ubuntu action's network steps: macOS ships no
    # coreutils `timeout` and the runner image adds none, so the bound would have to be
    # conditional on a binary that isn't there — which reads as protection while providing
    # none. This action also has no apt step, which is where the degradation was observed.
    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install webkit
