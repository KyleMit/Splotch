name: Set up Playwright WebKit
description: Install dependencies and cache the Playwright WebKit browser on macOS

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-pnpm

    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      run: node tools/print-playwright-version.mjs >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-webkit-${{ steps.playwright-version.outputs.version }}

    # Bounded for the same reason as the Ubuntu action's network steps — a composite
    # action's steps take no `timeout-minutes`, so an unbounded one turns a starved runner
    # into a job-level cancellation that names nothing. The mechanism differs because
    # macOS ships no coreutils `timeout` and the runner image adds none; `perl` is present
    # on stock macOS, so its `alarm` is the bound that needs no guard. The timer survives
    # `exec`, so it lands on the install rather than on a wrapper.
    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SETUP_TIMEOUT_S: '420'
      run: |
        perl -e 'alarm shift @ARGV; exec @ARGV' "$SETUP_TIMEOUT_S" npx playwright install webkit || {
          status=$?
          # SIGALRM terminates the process, which bash reports as 128 + 14.
          if [ "$status" = 142 ]; then
            echo "::error title=Playwright WebKit install timed out::Exceeded ${SETUP_TIMEOUT_S}s." \
              'Network starvation on this runner, not a test failure — re-run the job to get a' \
              'different machine.'
          fi
          exit $status
        }
