name: Set up Playwright WebKit
description: Install dependencies and cache the Playwright WebKit browser on macOS

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-pnpm

    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      run: node tools/print-playwright-version.mjs >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-webkit-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install webkit
