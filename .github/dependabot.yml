version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ['*']
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 30
    ignore:
      # The @types/node major tracks the Node runtime major, which Dependabot
      # cannot see or bump. Pinned to the runtime's major until the upgrade
      # tracked by issue 1624 lands; remove this rule with that issue.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
