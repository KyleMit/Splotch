version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ['*']
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 30
    ignore:
      # The @types/node major tracks the Node runtime major, which Dependabot
      # cannot see or bump. Pinned to the runtime's major until the upgrade
      # tracked by issue 1624 lands; remove this rule with that issue.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # dprint-plugin-markdown 0.23 wraps inside inline code spans with no
      # opt-out, breaking this repo's grep-able command contracts (670 spans
      # across 239 files). Held at 0.22 by issue 1634; remove with that issue.
      - dependency-name: '@dprint/markdown'
