[project]
name = "splotch-centerline-tracing"
version = "0.1.0"
description = "Opt-in filled-SVG to centerline tracing for Splotch assets"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-image>=0.23",
  "shapely>=2.0",
  "skan>=0.11",
  "svgelements>=1.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/centerline_tracing"]

[dependency-groups]
dev = ["pillow>=11", "pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: representative production trace requiring the full Python/Node pipeline"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B023", "E501"]
