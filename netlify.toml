# Production deploy config. The Netlify site builds from the repo ROOT (base directory = root, the
# default), because package.json + the lockfile live here so the install works.
#
# The site is the React Native web export (., ADR-0180) and one
# Netlify Function for every /api path (netlify/functions/api.ts). Netlify answers a request with,
# in order: a [[redirects]] rule below; a published file, by pretty URL (/privacy -> privacy.html,
# / -> index.html); a function whose config.path matches; then the export's 404.html, the React
# Native not-found page (docs/scratchpad/2026-10-20-rn-web-single-app/README.md, Hosting on
# Netlify).
#
[build]
  # `git fetch --tags` first: Netlify's blobless clone has the full commit graph
  # but does NOT fetch tags, so `git describe` in tools/release/lib/buildVersion.ts can't see the
  # release tag and the web version would fall back to major.minor.0+<sha>
  # (ADR-0030). `|| true` so a fetch hiccup never fails the build — the fallback
  # still produces a valid per-commit version.
  #
  # `build:site` is the export plus its browserless checks. The checks that drive
  # Chromium (every page without JavaScript, the admin console against the /api
  # function) need Playwright, which the --prod install leaves out; CI's
  # "Native web build" job runs them on every pull request.
  command = "git fetch --tags --force || true; node tools/netlify-production-install.mjs && npm run build:site"
  # Skip the build (exit 0 = skip) when the push touched nothing the web build
  # reads. The paths on the `ignore` line below are the whole watched set. Its
  # tools/ capability folders are enumerated rather than watching all of tools/,
  # so a change inside a folder the build never runs does not redeploy; every
  # flat tools/*.mjs entry point is watched, whether the build runs it or not.
  # The React Native app is watched except its Android and iOS projects, which
  # the web export never reads. pnpm-workspace.yaml is watched alongside the
  # lockfile because it carries the dependency overrides, so editing it changes
  # what the build installs.
  #
  # ':(glob)' on the flat entry points is load-bearing: in a plain Git pathspec
  # '*' crosses directory separators, so 'tools/*.mjs' would match every .mjs
  # under tools/ rather than only the flat ones, rebuilding on every
  # capability-folder change. tools/tests/enumerated-build-paths.test.mjs pins
  # that semantics, and checks the enumeration against the tools/ folders the
  # build:site script reaches through relative `from '…'` imports. That check
  # does not follow other import forms (side-effect or dynamic imports).
  # A skipped push leaves the previous deploy live, which is correct when
  # nothing user-facing changed (ADR-0070).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src assets netlify app.json babel.config.cjs metro.config.cjs postcss.config.mjs ':(glob)tools/*.mjs' tools/lib tools/migration tools/icons tools/marketing-assets tools/mobile tools/release releases package.json pnpm-lock.yaml pnpm-workspace.yaml patches netlify.toml"
  # The export, with the files the host serves beside it (build-native-web.mjs's
  # HOSTED_STATIC_ENTRIES: the coloring books, robots.txt, the deny page, ...).
  publish = "dist/web"

[build.environment]
  # dependencies == what this Netlify build needs; devDependencies == local/CI-only
  # tooling (Playwright, dprint, eslint, the Capacitor CLIs, ...). The
  # inverted split + --prod halves the install (ADR-0070). GitHub Actions and local
  # dev run a plain `pnpm install` and are unaffected. --prod is pnpm's --omit=dev;
  # npm's --no-audit/--no-fund have no pnpm equivalent because pnpm does neither on
  # install, and --frozen-lockfile is already implied by Netlify's CI=true.
  PNPM_FLAGS = "--prod"
  # The engines floor major from package.json engines.node, pinned so a Netlify
  # platform-default bump can't move the deploy off the major CI tests.
  # tools/tests/workflow-hygiene.test.mjs guards this agreement.
  NODE_VERSION = "22"

# Edge deny-rules (issue #347): only unambiguous credential/VCS dotfile probes,
# answered with the static `deny.html` and a 404, so a scanner's `/.env` or
# `/.git/config` never reaches a page document. Do NOT blanket-block `*.json` —
# the app serves `/version.json` and the webmanifest.
[[redirects]]
  from = "/.env*"
  to = "/deny.html"
  status = 404

[[redirects]]
  from = "/.git"
  to = "/deny.html"
  status = 404

[[redirects]]
  from = "/.git/*"
  to = "/deny.html"
  status = 404

# Deprecated tester links (ADR-0112). /android-beta and /ios-beta were single
# pages before /beta's two tabs replaced them, and both were handed out on their
# own, so they redirect rather than 404. betaPlatform.test.ts fails if these and
# the /beta page's tabs (src/lib/components/beta/betaPlatform.ts) disagree.
[[redirects]]
  from = "/android-beta"
  to = "/beta?os=android"
  status = 308

[[redirects]]
  from = "/ios-beta"
  to = "/beta?os=ios"
  status = 308

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # Cross-Origin-Opener-Policy: nothing here opens a popup or is opened as one,
    # so severing the cross-origin window.opener link costs nothing today; it
    # stops a future cross-origin opener relationship from being introduced
    # without first removing this header. A same-origin popup that sends the
    # same policy keeps its opener; the rel="noopener" on outbound links is
    # what covers those.
    # COEP and CORP are deliberately absent — the app collects nothing from
    # cross-origin isolation, and CORP would block the scrapbook origin from ever
    # embedding a brand asset (issue #1957).
    Cross-Origin-Opener-Policy = "same-origin"
    # Strict-Transport-Security: splotch.art is served exclusively over HTTPS by
    # Netlify (automatic certs + HTTP->HTTPS redirect), and the only relevant
    # hostname is the apex itself (the /api the browser calls is same-origin), so
    # pinning HTTPS is safe. No `preload` — that hardcodes the domain into browser
    # binaries and is effectively irreversible; includeSubDomains is safe because
    # there is no non-HTTPS *.splotch.art host.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    # Permissions-Policy (enforced): the drawing app uses none of these powerful
    # features, so deny them outright to shrink the attack surface. fullscreen and
    # autoplay are deliberately NOT listed — the canvas calls requestFullscreen()
    # and drawing plays audio, and both default to `self`.
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    # The CSP reporting endpoint group. Browser and delivery limits are recorded
    # in ADR-0073; securityHeaders.test.ts drift-guards this literal value.
    Reporting-Endpoints = 'csp="/api/csp-report"'
    # The directives a document's meta policy cannot carry. Each exported
    # document's own meta policy (tools/migration/lib/native-web-csp.mjs) holds
    # the rest, with its inline scripts hashed; netlify/securityPolicy.ts owns both.
    Content-Security-Policy = """\
      frame-ancestors 'none'; \
      report-uri /api/csp-report\
      """

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# The credentialed console (ADR-0101) is never cached, by the browser or the CDN;
# the service worker leaves it to the network too (build-native-web.mjs).
[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"

# Only a name that changes with its bytes may be cached immutable, or for longer than
# the week ADR-0042 allows a stable name: tools/tests/netlify-cache-rules.test.mjs
# fails on such a rule for any other path. Expo names every file under these two
# with its content hash, and the post-build precache check fails an export that
# holds an unhashed one. Page-only chunks are never precached, so this rule is
# what keeps a page document's repeat visit off the network.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/coloring/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
