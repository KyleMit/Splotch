apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
// Store identity is opt-in. A build is art.splotch.app.dev, signed with the local
// debug key, unless the store release scripts pass -Psplotch.store=true: only then
// does Release take art.splotch.app and the upload key named in the untracked
// keystore.properties (see keystore.properties.example). So no plain build, Release
// included, can install over the store copy on a device. Only this invocation's -P
// counts: a copy in gradle.properties or the environment would turn every build into
// a store build, so it is refused.
def storeProperty = gradle.startParameter.projectProperties['splotch.store']
if (storeProperty == null && findProperty('splotch.store') != null) {
    throw new GradleException("splotch.store counts only as -Psplotch.store=true on the command line; remove it from gradle.properties and the environment")
}
if (storeProperty != null && storeProperty != 'true') {
    throw new GradleException("splotch.store must be true when set, got '${storeProperty}'")
}
def storeBuild = storeProperty == 'true'
def uploadKeyFile = rootProject.file('keystore.properties')
def uploadKey = new Properties()
if (storeBuild) {
    if (!uploadKeyFile.isFile()) {
        throw new GradleException("A store build signs with the upload key: create ${uploadKeyFile} from keystore.properties.example")
    }
    uploadKeyFile.withInputStream { uploadKey.load(it) }
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !uploadKey[it] }
    if (missing) {
        throw new GradleException("${uploadKeyFile} lacks ${missing.join(', ')}")
    }
}

react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "art.splotch.app"
    defaultConfig {
        applicationId "art.splotch.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.6.0"
        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", '"stable"'
    }
    signingConfigs {
        if (storeBuild) {
            upload {
                storeFile rootProject.file(uploadKey['storeFile'])
                storePassword uploadKey['storePassword']
                keyAlias uploadKey['keyAlias']
                keyPassword uploadKey['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev"
        }
        release {
            if (!storeBuild) {
                applicationIdSuffix ".dev"
            }
            signingConfig storeBuild ? signingConfigs.upload : signingConfigs.debug
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            crunchPngs true
        }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging false }
    }
}

dependencies {
    implementation "androidx.work:work-runtime:2.11.2"
    implementation "com.google.guava:guava:33.3.1-android"
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
